name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper:
    name: Helper tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]          # oldest supported and newest tested
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install -r tests/requirements-test.txt
      - name: Build the single file
        run: python tools/build.py
      - name: Helper tests
        run: python -m pytest tests/test_server.py -v

  browser:
    name: Browser tests · Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install -r tests/requirements-ui.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build the single file
        run: python tools/build.py
      - name: Browser tests
        run: python -m pytest tests/test_ui.py -v
      - name: Keep the built file
        uses: actions/upload-artifact@v6
        with:
          name: otm_explorer-${{ github.sha }}
          path: |
            dist/otm_explorer.py
            dist/otm_explorer.py.sha256
