name: Release

# Push a tag like v1.10.0 (or v1.10.0-beta.2 for a pre-release) to build, test and publish
# dist/otm_explorer.py on the GitHub Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install -r tests/requirements-ui.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build the single file with the tag's version
        run: python tools/build.py --version "${GITHUB_REF_NAME}"
      - name: Run all tests
        run: python -m pytest tests -v
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/otm_explorer.py dist/otm_explorer.py.sha256 \
            --title "${GITHUB_REF_NAME}" --generate-notes ${pre}
